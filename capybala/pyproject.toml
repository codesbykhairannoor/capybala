[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capybala"
version = "0.9.2"
authors = [
  { name = "Khairan Noor Fadhlillah", email = "khairan.noor.f@students.esqbs.ac.id" },
]
description = "Context-Aware Pruning for Yielding & Backtrack-Aligned Loop Avoidance: The chill, self-healing runtime that cures autonomous AI agents from cognitive deadlocks."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
llama-stack = ["llama-stack-client"]
langchain = ["langchain-core"]
all = ["llama-stack-client", "langchain-core"]

[project.urls]
"Homepage" = "https://github.com/codesbykhairannoor/capybala"
"Preprint Paper" = "https://doi.org/10.21203/rs.3.rs-11597011/v1"
"Benchmark Dataset" = "https://www.kaggle.com/datasets/khairan7/ai-agent-cognitive-deadlock-benchmark/data"
"Live Interactive Demo" = "https://capybala.onrender.com"
"Bug Tracker" = "https://github.com/codesbykhairannoor/capybala/issues"
