<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Capybala Official Mascot: Ollama-Style Minimalist Black Sketch -->
  <g stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Iconic Yuzu Citrus Balanced on Flat Crown -->
    <!-- Leaf -->
    <path d="M 36.5 5.5 C 39.5 2.5, 44.5 3.5, 43.5 7.5 C 40.5 8.5, 37.5 7.5, 36.5 5.5 Z" fill="#000000" stroke-width="0.8"/>
    <!-- Stem -->
    <path d="M 35 10.5 L 36.5 6.5" stroke-width="1.8"/>
    <!-- Fruit -->
    <circle cx="34.5" cy="14" r="4.2" fill="none"/>

    <!-- 2. Small Rounded Ear perched at the back corner of flat crown -->
    <path d="M 23 22.5 C 20.5 19, 21 15.5, 24.5 15.5 C 27.5 15.5, 27.5 19, 26 23" fill="none"/>
    <path d="M 23.5 20.5 C 23.5 18, 25.5 18, 25.5 20.5" stroke-width="1.4"/>

    <!-- 3. Unmistakable Capybara Loaf Profile Silhouette -->
    <!-- Crown -> Flat Snout -> Blunt Drop -> Chin -> Throat -> Front Paw -> Ground -> Big Round Rump -> Back -->
    <path d="
      M 26 23
      L 41 23
      C 46 23, 51 25, 53.5 28
      C 54.5 29.5, 54.5 33.5, 54 36.5
      C 53.5 39.5, 50 41.5, 45 41.5
      C 41 41.5, 38 43.5, 37 46.5
      L 37 53.5
      L 31 53.5
      L 31 50.5
      C 26 51.5, 21 52.5, 17 52.5
      C 12 52.5, 7 48.5, 7 41.5
      C 7 33.5, 12 27.5, 18 25.5
      C 20.5 24.5, 23 23.5, 26 23
      Z
    " fill="none"/>

    <!-- 4. Minimalist Facial Features (Chill Stoic Zen) -->
    <!-- Characteristic Blunt Nostril Slit -->
    <path d="M 49.5 30 C 51 31, 52 31, 52.8 30.2" stroke-width="2"/>

    <!-- Serene Horizontal Smile Eye (The Calm Guardrail) -->
    <path d="M 37.5 29 C 39 27.7, 42 27.7, 43.5 29" stroke-width="2.2"/>

    <!-- Gentle Mouth Slit -->
    <path d="M 48 37.5 C 50 38.3, 52 38, 53.5 37" stroke-width="1.8"/>

    <!-- Front Leg separation line -->
    <path d="M 33 46.5 L 33 53.5" stroke-width="1.8"/>

    <!-- Rear Haunch Wrinkle (The Capybara Potato Loaf) -->
    <path d="M 14 42.5 C 17 43.5, 19 46.5, 19 49.5" stroke-width="1.8"/>
  </g>
</svg>